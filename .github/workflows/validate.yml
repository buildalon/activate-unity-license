name: validate
on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  push:
    branches: [main]
  pull_request:
    branches: ['*']
    types: [opened, synchronize, reopened, ready_for_review]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/
      - uses: RageAgainstThePixel/job-builder@v1
        id: setup-jobs
        with:
          build-options: ./.github/workflows/build-options.json
          # one group per editor version; every group runs at once, since macOS and Linux rows share one seat per OS
          # and Windows rows return theirs
          group-by: unity-version
          job-name-prefix: Install
    outputs:
      jobs: ${{ steps.setup-jobs.outputs.jobs }}
  # One sign-in per OS for the whole run, which tests the action's sign-in and activation on Windows, macOS and Linux.
  # macOS and Linux runners share one machine identity, so the license activated here serves every macOS or Linux row
  # of this run. It is passed on encrypted, because artifacts of a public repository can be downloaded by anyone, and
  # it is never returned: a return would revoke it for every job on that identity, other repositories' included.
  # license-cleanup deletes it after the run. Windows runners are a new machine every job, so the Windows license is
  # returned by the post step and not shared.
  license:
    if: github.event.pull_request.draft == false
    name: license ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Check secrets
        id: secrets
        shell: bash
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          if [ -z "${UNITY_USERNAME}" ] || [ -z "${UNITY_PASSWORD}" ] || [ -z "${CI_TOKEN}" ]; then
            # pull requests from forks get no secrets; their rows fall back to their own activation
            echo '::warning::No Unity credentials or CI_TOKEN, so this run has no shared license'
            exit 0
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"
      - uses: ./ # buildalon/activate-unity-license
        if: ${{ steps.secrets.outputs.available == 'true' }}
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - name: Encrypt run license
        id: encrypt
        if: ${{ steps.secrets.outputs.available == 'true' && runner.os != 'Windows' }}
        shell: bash
        env:
          # the encryption key comes from a random token, never the account password, so the public artifact gives
          # nobody a way to test password guesses offline
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          license="$(npx --yes @rage-against-the-pixel/unity-cli@4 license-file-path)"
          dir="${RUNNER_TEMP}/unity-license"
          mkdir -p "${dir}"
          # the key never reaches a command line: openssl reads it from the environment
          export LICENSE_KEY="${CI_TOKEN}:${GITHUB_RUN_ID}"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "${license}" -out "${dir}/unity-license.enc" -pass env:LICENSE_KEY
          echo "encrypted=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        if: ${{ steps.encrypt.outputs.encrypted == 'true' }}
        with:
          name: unity-license-${{ runner.os }}
          path: ${{ runner.temp }}/unity-license/unity-license.enc
          retention-days: 1
          if-no-files-found: error
  validate:
    # the rows still run when the license job fails, and activate with the account instead
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.jobs }}
    needs: [setup, license]
    name: ${{ matrix.jobs.name }}
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.jobs) }}
      fail-fast: false
    secrets: inherit
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ toJSON(matrix.jobs.matrix) }}
  license-cleanup:
    needs: [license, validate]
    # a failed run keeps its license for rerun-validate's retries, up to its last attempt; the artifact expires in a day
    if: ${{ always() && (needs.validate.result == 'success' || github.run_attempt >= 3) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # to delete this run's license artifacts
    steps:
      - name: Delete the run license
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name | startswith("unity-license-")) | .id')"
          count=0
          for id in ${ids}; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            count=$((count + 1))
          done
          echo "Deleted ${count} license artifacts"
  timeline:
    needs: [setup, license, validate]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
        continue-on-error: true
